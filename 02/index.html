<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Like</title>
</head>
<body>
<script>
const likeButton = document.createElement("button");
likeButton.textContent = "Like";
document.body.appendChild(likeButton);
likeButton.addEventListener("click", function () {
  const message = "Liked!";
  alert(message);
  console.log(message);
});
</script>

</body>
</html>
